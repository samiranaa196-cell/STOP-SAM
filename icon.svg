<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10264a"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#01040a"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69d8ff"/>
      <stop offset="45%" stop-color="#2873df"/>
      <stop offset="100%" stop-color="#174b96"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e5f5"/>
      <stop offset="100%" stop-color="#8ea3bf"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect
    x="8"
    y="8"
    width="496"
    height="496"
    rx="100"
    fill="url(#bg)"
    stroke="#244d86"
    stroke-width="5"/>


  <!-- INNER BORDER -->

  <rect
    x="22"
    y="22"
    width="468"
    height="468"
    rx="88"
    fill="none"
    stroke="#0d315e"
    stroke-width="2"/>


  <!-- GLOW BEHIND RING -->

  <circle
    cx="256"
    cy="190"
    r="142"
    fill="#1674ff"
    opacity="0.08"
    filter="url(#softGlow)"/>


  <!-- OUTER RING -->

  <circle
    cx="256"
    cy="190"
    r="126"
    fill="none"
    stroke="#102d58"
    stroke-width="18"/>


  <!-- BLUE RING -->

  <path
    d="M256 64
       A126 126 0 0 1 382 190"
    fill="none"
    stroke="url(#blue)"
    stroke-width="14"
    stroke-linecap="round"
    filter="url(#glow)"/>


  <!-- LEFT RING -->

  <path
    d="M130 190
       A126 126 0 0 1 256 64"
    fill="none"
    stroke="#2868d1"
    stroke-width="14"
    stroke-linecap="round"/>


  <!-- BOTTOM RING -->

  <path
    d="M130 190
       A126 126 0 0 0 256 316"
    fill="none"
    stroke="#2868d1"
    stroke-width="14"
    stroke-linecap="round"/>


  <path
    d="M256 316
       A126 126 0 0 0 382 190"
    fill="none"
    stroke="#397ee8"
    stroke-width="14"
    stroke-linecap="round"/>


  <!-- S SYMBOL -->

  <path
    d="
      M300 112
      L220 112
      Q195 112 181 132
      L160 165
      L214 142
      L280 142
      L300 112
      Z
    "
    fill="url(#blue)"
    filter="url(#glow)"/>


  <path
    d="
      M212 172
      L250 172
      L222 195
      L190 195
      Z
    "
    fill="#398df2"/>


  <path
    d="
      M302 168
      L342 196
      L318 230
      L282 230
      L303 207
      L270 207
      Z
    "
    fill="url(#silver)"
    filter="url(#glow)"/>


  <path
    d="
      M282 230
      L302 230
      Q313 230 306 243
      L283 270
      L205 270
      L225 240
      L270 240
      Z
    "
    fill="url(#silver)"/>


  <!-- SEPARATOR -->

  <line
    x1="155"
    y1="337"
    x2="357"
    y2="337"
    stroke="#163d70"
    stroke-width="2"/>


  <!-- STOP -->

  <text
    x="256"
    y="365"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="62"
    font-weight="900"
    letter-spacing="9"
    fill="url(#silver)">
    STOP
  </text>


  <!-- BLUE LINES -->

  <line
    x1="100"
    y1="393"
    x2="175"
    y2="393"
    stroke="#398df2"
    stroke-width="4"
    stroke-linecap="round"
    filter="url(#glow)"/>

  <line
    x1="337"
    y1="393"
    x2="412"
    y2="393"
    stroke="#398df2"
    stroke-width="4"
    stroke-linecap="round"
    filter="url(#glow)"/>


  <!-- SAM -->

  <text
    x="256"
    y="407"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="800"
    letter-spacing="16"
    fill="url(#blue)">
    SAM
  </text>


  <!-- TAGLINE -->

  <text
    x="256"
    y="442"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    font-weight="500"
    letter-spacing="4"
    fill="#8fa5c2">
    ONE DAY AT A TIME
  </text>


</svg>
