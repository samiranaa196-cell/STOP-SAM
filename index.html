<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#071426">

  <meta name="description"
        content="STOP SAM - Streak, Habits and Challenges">

  <link rel="manifest" href="manifest.json">

  <link rel="icon"
        href="icon.svg"
        type="image/svg+xml">

  <link rel="stylesheet"
        href="style.css">

  <title>STOP SAM</title>
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <div class="brand">
        <h1>STOP SAM</h1>
        <p>One day at a time.</p>
      </div>

      <button
        class="settings-btn"
        onclick="openSettings()"
        aria-label="Settings">
        ⚙️
      </button>

    </header>


    <!-- MAIN TIMER -->
    <main>

      <section class="timer-card">

        <div class="circle">

          <div class="circle-inner">

            <h2 id="day">Day 1</h2>

            <div id="timer">
              00 : 00 : 00
            </div>

            <span>
              CURRENT STREAK
            </span>

          </div>

        </div>


        <button
          class="relapse-btn"
          onclick="relapse()">

          ↻ &nbsp; Relapse / Reset

        </button>


        <p id="message">
          Start strong. Your next good choice counts.
        </p>

      </section>



      <!-- STATISTICS -->
      <section class="stats">

        <div class="stat">
          <strong id="best">0</strong>
          <small>Best Days</small>
        </div>

        <div class="stat">
          <strong id="total">0</strong>
          <small>Total Days</small>
        </div>

        <div class="stat">
          <strong id="attempts">0</strong>
          <small>Attempts</small>
        </div>

      </section>



      <!-- FEATURES -->
      <section class="features">

        <button
          onclick="openHabits()"
          class="feature">

          <div class="feature-icon">
            ✓
          </div>

          <h3>
            Daily Habits
          </h3>

          <p id="habitStatus">
            0/4 Done
          </p>

        </button>



        <button
          onclick="openChallenges()"
          class="feature">

          <div class="feature-icon">
            🎯
          </div>

          <h3>
            My Challenges
          </h3>

          <p id="challengeStatus">
            0 Active
          </p>

        </button>



        <button
          onclick="openAttempts()"
          class="feature">

          <div class="feature-icon">
            ▣
          </div>

          <h3>
            My Attempts
          </h3>

          <p>
            View History
          </p>

        </button>



        <button
          onclick="openGuide()"
          class="feature">

          <div class="feature-icon">
            📖
          </div>

          <h3>
            Recovery Guide
          </h3>

          <p>
            Daily Reading
          </p>

        </button>

      </section>


      <!-- ABOUT -->
      <button
        class="about"
        onclick="openAbout()">

        About App

      </button>

    </main>

  </div>



  <!-- MODAL -->
  <div
    id="modal"
    class="modal">

    <div class="modal-box">

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

      <div id="modalContent"></div>

    </div>

  </div>



  <!-- TOAST -->
  <div
    id="toast"
    class="toast">
  </div>



  <!-- JAVASCRIPT -->
  <script src="app.js"></script>


  <!-- SERVICE WORKER -->
  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker
          .register("./sw.js")
          .then(function () {

            console.log(
              "STOP SAM offline mode ready"
            );

          })
          .catch(function (error) {

            console.log(
              "Service Worker Error:",
              error
            );

          });

      });

    }

  </script>

</body>
</html>
